machine:
  kernel:
    modules:
      - name: nf_tables
      - name: nft_nat
      - name: nft_chain_nat
      - name: nft_masq
      - name: nft_ct
      - name: br_netfilter
      - name: bridge
  certSANs:
    - dels-cp-0.dellsperger.me
    - dels-cp-0.local
    - dels-cp-0
  features:
    hostDNS:
      enabled: true
    kubernetesTalosAPIAccess:
      allowedKubernetesNamespaces:
        - system-upgrade # tuppr
      allowedRoles:
        - os:admin
      enabled: true
  install:
    wipe: true
    diskSelector:
      type: nvme # Consider NVMe Disks only
  kubelet:
    nodeIP:
      # The `validSubnets` field configures the networks to pick kubelet node IP from.
      validSubnets:
        - 172.16.254.0/24
        - fd00:254::/64

cluster:
  controlPlane:
    endpoint: https://172.16.254.1:6443 # Endpoint is the canonical controlplane endpoint, which can be an IP address or a DNS hostname.
  etcd:
    advertisedSubnets: # listenSubnets defaults to advertisedSubnets if not set explicitly
      - 172.16.254.0/24
      - fd00:254::/64
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: dels-cp-0
auto: off
---
# Mgmt: dummy member keeps br-mgmt carrier up even if the SFP link (enp5s0f0np0) drops
apiVersion: v1alpha1
kind: DummyLinkConfig
name: dummy0
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br-mgmt
links:
  - dummy0
  - enp5s0f0np0 # Right SFP NIC
stp:
  enabled: false
addresses:
  - address: 172.16.254.1/24
  - address: fd00:254::1/64
---
# LAN: Access Points on enp3s0/enp4s0, bridged onto the same L2 segment.
# STP left enabled since two uplinks into one bridge could form a loop.
apiVersion: v1alpha1
kind: BridgeConfig
name: br-lan
links:
  - enp3s0 # Left 2.5Gbit NIC
  - enp4s0 # Right 2.5Gbit NIC
stp:
  enabled: true
addresses:
  - address: 10.0.97.1/24
---
# WAN
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp7s0f1np1
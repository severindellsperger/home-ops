machine:
  certSANs:
    - dels-cp-0.ip6.run
    - dels-cp-0.local
    - dels-cp-0
cluster:
  etcd:
    advertisedSubnets: # listenSubnets defaults to advertisedSubnets if not set explicitly
      - 172.16.254.0/24
      - fd00:254::/64
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
# No taints: single node cluster, workloads run on the control plane.
nodeIP:
  # The `validSubnets` field configures the networks to pick kubelet node IP from.
  validSubnets:
    - 172.16.254.0/24
    - fd00:254::/64
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
allowedKubernetesNamespaces:
  - system-upgrade # tuppr
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nf_tables
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nft_nat
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nft_chain_nat
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nft_masq
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nft_ct
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: br_netfilter
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: bridge
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: dels-cp-0
auto: off
---
# Mgmt: dummy member keeps br-mgmt carrier up even if the SFP link (enp5s0f0np0) drops
apiVersion: v1alpha1
kind: DummyLinkConfig
name: dummy0
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br-mgmt
links:
  - dummy0
  - enp5s0f0np0 # Right SFP NIC
stp:
  enabled: false
addresses:
  - address: 172.16.254.1/24
  - address: fd00:254::1/64
---
# LAN: Access Points on enp3s0/enp4s0, bridged onto the same L2 segment.
# STP left enabled since two uplinks into one bridge could form a loop.
apiVersion: v1alpha1
kind: BridgeConfig
name: br-lan
links:
  - enp3s0 # Left 2.5Gbit NIC
  - enp4s0 # Right 2.5Gbit NIC
stp:
  enabled: true
addresses:
  - address: 10.0.97.1/24
---
# WAN
apiVersion: v1alpha1
kind: DHCPv4Config
name: enp7s0f1np1
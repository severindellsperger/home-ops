apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vyos-state
  namespace: priviledged
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vyos
  namespace: priviledged
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vyos
  template:
    metadata:
      labels:
        app: vyos
    spec:
      hostNetwork: true # Pod uses the node's hostname (dels-cp-0), spec.hostname is ignored
      # Make the node hostname resolvable inside the pod (fixes "sudo: unable to resolve host dels-cp-0")
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - dels-cp-0
      initContainers:
      - name: flush-vyos-nft
        image: ghcr.io/severindellsperger/vyos-container:2026.03
        command:
          - /bin/bash
          - -c
          - |
            for t in "ip vyos_filter" "ip6 vyos_filter" "bridge vyos_filter" \
                     "ip vyos_nat" "ip vyos_static_nat" \
                     "ip vyos_mangle" "ip6 vyos_mangle" \
                     "ip vyos_conntrack" "ip6 vyos_conntrack"; do
              nft delete table $t 2>/dev/null || true
            done
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
      containers:
      - name: vyos
        image: ghcr.io/severindellsperger/vyos-container:2026.03
        stdin: true
        tty: true
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
              - SYS_ADMIN
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  # Neutralize modprobe and rmmod for the VyOS config engine
                  ln -sf /bin/true /usr/sbin/modprobe
                  ln -sf /bin/true /sbin/modprobe
                  ln -sf /bin/true /usr/sbin/rmmod
                  ln -sf /bin/true /sbin/rmmod
        volumeMounts:
          # VyOS bind-mounts /opt/vyatta/etc/config onto /config at boot, so the
          # directory must be writable (DHCP leases, config archive). Only
          # config.boot comes read-only from the ConfigMap.
          - name: vyos-state
            mountPath: /opt/vyatta/etc/config
          - name: vyos-config
            mountPath: /opt/vyatta/etc/config/config.boot
            subPath: config.boot
            readOnly: true
      volumes:
        - name: vyos-config
          configMap:
            name: vyos-config
            defaultMode: 0777
        - name: vyos-state
          persistentVolumeClaim:
            claimName: vyos-state
